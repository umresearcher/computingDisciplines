<meta charset="utf-8">
<title>You Own the Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one game "stage" per screen &#x2014; HUD strip on top, character column left, dialogue + decisions right; collapses to a single column with a head avatar on phones. Night-shift palette, single dark theme by design. */
:root {
  --night: #17163A; --panel: #232259; --line: #2E2C66; --paper: #F6F2E7; --ink: #17163A;
  --lilac: #B9B2FF; --signal: #FFD23F; --signal-shadow: #B8901A; --coral: #FF6B4A; --coral-text: #FF8C70;
  --teal: #3DD6C4; --teal-dark: #1E8C80; --topic: #DCD8FF; --muted-ink: #4A4766; --rule: #E2DCCB;
  --font-display: "Bricolage Grotesque", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--paper); font-family: var(--font-body); font-size: 16px; }
*, *::before, *::after { box-sizing: border-box; }
#app { min-height: 100%; display: flex; flex-direction: column; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
main:focus, main:focus-visible { outline: none; }
h1, h2 { text-wrap: balance; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shared pieces ---------- */
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100%; animation: screenIn .35s ease-out both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.hud { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 40px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.brand span { font-size: 15px; color: var(--lilac); }
.progress { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--lilac); }
.progress .track { width: 160px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress .fill { height: 100%; border-radius: 4px; background: var(--signal); transition: width .5s ease; }
.clicks { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--panel); color: var(--lilac); font-size: 15px; border: 2px solid transparent; }
.clicks strong { color: var(--paper); }
.clicks small { font-size: 12px; }
.clicks.up { background: var(--coral); color: var(--ink); }
.clicks.up strong { color: var(--ink); }
.clicks.down { border-color: var(--coral); color: var(--coral-text); }
.clicks.down strong { color: var(--coral-text); }
.clicks.down .total { color: var(--lilac); }

.stage { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 48px; padding: 0 64px; }
.stage.wide-char { grid-template-columns: 380px minmax(0, 1fr); gap: 56px; }
.stage.single { grid-template-columns: minmax(0, 1fr); max-width: 1000px; }
.char-col { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-height: 520px; }
.char-col .disc { position: absolute; left: 50%; bottom: 60px; width: 360px; height: 360px; margin-left: -180px; border-radius: 50%; }
.char-col svg.figure { position: relative; width: 340px; height: auto; display: block; }
.char-col .plate { position: absolute; left: 0; bottom: 32px; display: flex; flex-direction: column; gap: 2px; padding: 12px 18px; background: var(--night); border: 2px solid var(--paper); border-radius: 14px; }
.plate b { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.1; }
.plate span { font-size: 15px; color: var(--lilac); }
.char-col .float-bubble { position: absolute; top: 40px; left: 0; max-width: 340px; border-radius: 22px 22px 6px 22px; }
.content { display: flex; flex-direction: column; gap: 14px; padding-block: 36px; min-width: 0; }
.head-row, .head-row-bubble { display: none; }

.eyebrow { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--lilac); }
.bubble { align-self: flex-start; max-width: 640px; background: var(--paper); color: var(--ink); font-size: 22px; line-height: 1.4; padding: 14px 22px; border-radius: 22px 22px 22px 6px; box-shadow: 6px 6px 0 #0D0C26; animation: pop .35s ease-out both; }
.bubble:nth-of-type(2) { animation-delay: .25s; } .bubble:nth-of-type(3) { animation-delay: .5s; } .bubble:nth-of-type(4) { animation-delay: .75s; } .bubble:nth-of-type(5) { animation-delay: 1s; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.spacer { flex: 1; min-height: 8px; }
.hint { font-size: 16px; color: var(--lilac); }
.replies { display: flex; gap: 16px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 28px; background: var(--signal); color: var(--ink); border: 0; border-radius: 16px; font-family: var(--font-display); font-weight: 800; font-size: 24px; text-decoration: none; box-shadow: 0 6px 0 var(--signal-shadow); cursor: pointer; transition: transform .08s ease, box-shadow .08s ease; text-align: left; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--signal-shadow); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--signal-shadow); }
.key { flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px; border: 2.5px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 17px; font-family: var(--font-display); font-weight: 800; }
.key.wide { width: auto; padding: 0 9px; font-family: var(--font-body); font-size: 14px; font-weight: 700; height: 28px; }
.btn-ghost { display: inline-flex; align-items: center; min-height: 52px; padding: 0 22px; background: transparent; color: var(--paper); border: 2px solid var(--paper); border-radius: 14px; font-family: var(--font-display); font-weight: 800; font-size: 19px; cursor: pointer; }
.btn-ghost:hover { background: rgba(246,242,231,.08); }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 20px 24px; background: var(--signal); color: var(--ink); border: 0; border-radius: 18px; box-shadow: 0 6px 0 var(--signal-shadow); cursor: pointer; text-align: left; transition: transform .08s ease, box-shadow .08s ease; }
.choice:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--signal-shadow); }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--signal-shadow); }
.choice .t { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.15; }
.choice .d { font-size: 18px; line-height: 1.35; }
.choice .tradeoff { font-size: 16px; font-weight: 700; }
.choice.big { padding: 24px 28px; }
.choice.big .t { font-size: 28px; }

/* readers */
.reader-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 8px; }
.reader-card { display: flex; flex-direction: column; gap: 10px; padding: 18px; background: var(--panel); border-radius: 20px; }
.reader-card b { font-family: var(--font-display); font-weight: 800; font-size: 24px; }
.reader-card .role { font-size: 15px; color: var(--lilac); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-outline { padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--paper); font-size: 14px; }
.reader-strip { display: flex; gap: 12px; flex-wrap: wrap; }
.reader-pill { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 999px; padding: 6px 18px 6px 6px; }
.reader-pill b { font-size: 17px; display: block; }
.reader-pill span { font-size: 14px; color: var(--lilac); }

/* feed */
.rule-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pill { padding: 5px 12px; border-radius: 999px; border: 2px solid currentColor; font-size: 14px; font-weight: 700; }
.pill.coral { color: var(--coral-text); } .pill.teal { color: var(--teal); } .pill.lilac { color: var(--lilac); }
.scene-title { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: 1.1; }
.feed { background: var(--paper); color: var(--ink); border-radius: 22px; padding: 8px 0; box-shadow: 8px 8px 0 #0D0C26; max-width: 640px; overflow: hidden; }
.feed-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 22px 12px; border-bottom: 2px solid var(--rule); flex-wrap: wrap; }
.feed-head .who { display: flex; align-items: center; gap: 10px; }
.feed-head b { font-size: 17px; }
.feed-head time { font-size: 15px; color: #5B587A; }
.feed-head .note { padding: 3px 10px; border-radius: 999px; border: 1.5px solid #5B587A; font-size: 13px; color: var(--muted-ink); }
.post { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 13px 22px; border-bottom: 2px solid var(--rule); }
.post:last-child { border-bottom: 0; }
.post.hl { background: #E6F8F5; }
.post.dashed { background: #E6F8F5; outline: 3px dashed var(--teal-dark); outline-offset: -6px; }
.post .rank { font-family: var(--font-display); font-weight: 800; font-size: 32px; }
.post .title { font-size: 18px; font-weight: 700; line-height: 1.3; display: block; }
.post .meta { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; font-size: 14px; color: #4F4C6E; margin-top: 4px; }
.tag { padding: 2px 8px; border-radius: 6px; font-weight: 700; }
.tag.nosrc { background: var(--ink); color: var(--paper); }
.tag.src { background: var(--teal-dark); color: #fff; }
.move { padding: 6px 10px; border-radius: 10px; font-size: 15px; font-weight: 700; white-space: nowrap; }
.move.up { background: var(--coral); color: var(--ink); }
.move.down { background: var(--ink); color: var(--paper); }
.move.same { border: 2px solid #5B587A; color: #3F3C5C; }
.move.new { background: var(--teal-dark); color: #fff; }
.move.topic { background: var(--topic); color: var(--ink); }
.caption { margin: 0; max-width: 640px; font-size: 20px; line-height: 1.45; }
.next-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.aside { display: flex; align-items: center; gap: 12px; max-width: 640px; }
.aside .say { background: var(--panel); border-radius: 6px 16px 16px 16px; padding: 10px 16px; font-size: 18px; line-height: 1.4; }
.dropped { display: flex; align-items: center; gap: 12px; max-width: 640px; padding: 10px 16px; border: 2px dashed #6F6AA8; border-radius: 14px; font-size: 16px; line-height: 1.4; }
.dropped .tag { background: var(--paper); color: var(--ink); font-size: 13px; flex-shrink: 0; }

/* compare cards (S05) */
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 6px; }
.compare > div { display: flex; flex-direction: column; gap: 10px; padding: 18px; background: var(--paper); color: var(--ink); border-radius: 18px; }
.compare .h { font-size: 18px; font-weight: 700; line-height: 1.3; }
.compare ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.compare li { display: flex; align-items: center; gap: 8px; }

/* debate (S06, S09) */
.debate { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; }
.debater { display: flex; gap: 18px; align-items: flex-start; }
.debater .head { width: 120px; height: 120px; flex-shrink: 0; }
.debater .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.debater .name { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.debater .bubble { border-radius: 6px 22px 22px 22px; }
.head { border-radius: 50%; overflow: hidden; display: block; }
.head svg { display: block; width: 100%; height: 100%; }

/* chart (S08) */
.topic-chart { display: flex; flex-direction: column; gap: 12px; padding: 20px 22px; background: var(--panel); border-radius: 20px; max-width: 640px; }
.topic-chart .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.topic-chart .legend { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--lilac); }
.topic-chart .legend i { width: 18px; height: 18px; border-radius: 5px; background: var(--paper); }
.grid3 { display: grid; grid-template-columns: 64px repeat(3, minmax(0, 1fr)); gap: 10px; align-items: center; }
.grid3 .day { font-size: 16px; font-weight: 700; color: var(--lilac); }
.tile { height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; padding: 0 6px; }
.tile.same { background: var(--paper); color: var(--ink); font-weight: 700; }
.tile.other { border: 2px solid #6F6AA8; }

/* checks */
.check-wrap { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding: 48px 0; }
.check-q { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 42px; line-height: 1.15; }
.answers { display: flex; flex-direction: column; gap: 14px; }
.answer { display: flex; align-items: center; gap: 16px; min-height: 74px; padding: 12px 28px; background: var(--signal); color: var(--ink); border: 0; border-radius: 18px; box-shadow: 0 6px 0 var(--signal-shadow); font-size: 22px; font-weight: 700; text-align: left; cursor: pointer; }
.answer:disabled { cursor: default; }
.answer.dim { background: transparent; color: #9C97D6; box-shadow: none; border: 2px solid #3E3B7A; }
.answer.dim .key { border-color: #6F6AA8; }
.answer.right { background: var(--teal); box-shadow: 0 6px 0 var(--teal-dark); }
.answer.wrong { background: var(--coral); box-shadow: 0 6px 0 #B4452C; }
.answer .verdict { margin-left: auto; font-size: 15px; white-space: nowrap; }
.feedback { display: flex; align-items: flex-start; gap: 16px; animation: pop .35s ease-out both; }
.feedback .head { width: 72px; height: 72px; flex-shrink: 0; }
.feedback .bubble { border-radius: 6px 22px 22px 22px; font-size: 21px; }

/* result */
.result-wrap { width: 100%; max-width: 1152px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding: 32px 0 36px; }
.result-title { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.1; }
.result-grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px; }
.watched { display: flex; flex-direction: column; gap: 14px; padding: 24px; background: var(--panel); border-radius: 24px; }
.watched .big { font-family: var(--font-display); font-weight: 800; font-size: 72px; line-height: 1; color: var(--coral-text); font-variant-numeric: tabular-nums; }
.scorecard { display: flex; flex-direction: column; gap: 16px; padding: 24px 28px; background: var(--paper); color: var(--ink); border-radius: 24px; min-width: 0; }
.scorecard .total { font-family: var(--font-display); font-weight: 800; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
.scorecard .total small { font-size: 24px; color: #5B587A; }
.part { display: grid; grid-template-columns: 150px minmax(0, 1fr) 56px; gap: 6px 16px; align-items: center; }
.part b { font-size: 18px; }
.part .bar { height: 12px; border-radius: 6px; background: var(--rule); overflow: hidden; }
.part .bar i { display: block; height: 100%; background: var(--teal-dark); border-radius: 6px; transform-origin: left; animation: grow .9s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.part .n { font-size: 18px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.part p { grid-column: 2 / span 2; margin: 0; font-size: 15px; line-height: 1.4; color: #3F3C5C; }
.how { font-size: 14px; color: #5B587A; }
.how summary { cursor: pointer; font-weight: 700; color: var(--ink); }
.how ul { margin: 8px 0 0; padding-left: 18px; line-height: 1.5; }

/* lab */
.lab-stage { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 440px minmax(0, 1fr); gap: 44px; padding: 24px 64px 28px; }
.dial { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px 12px; background: var(--panel); border-radius: 14px; }
.dial .top { display: flex; justify-content: space-between; align-items: baseline; }
.dial b { font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.dial .word { font-size: 14px; font-weight: 700; color: var(--signal); }
.dial .hint { font-size: 14px; }
.steps { display: flex; gap: 6px; }
.step { flex: 1; min-height: 40px; border-radius: 8px; border: 2px solid #4A4790; background: transparent; color: var(--paper); font-weight: 700; font-size: 14px; cursor: pointer; }
.step[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); color: var(--ink); }
.tabs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tab { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 10px; border-radius: 999px; border: 2px solid var(--paper); background: transparent; color: var(--paper); font-weight: 700; font-size: 16px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
.tab i { width: 18px; height: 18px; border-radius: 50%; }
.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.meter { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--panel); border-radius: 14px; }
.meter span { font-size: 14px; color: var(--lilac); }
.meter b { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.meter .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 4px; transition: width .35s ease; }

/* ---------- title page ---------- */
.title-page { position: relative; overflow: hidden; background: linear-gradient(180deg, #15133A 0%, #1C1849 28%, #2A2361 50%, #3F3182 68%, #5E4596 84%, #8A5FA8 100%); padding: 0 16px 28px; }
.title-page .top { position: relative; z-index: 2; max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 26px 24px 0; flex-wrap: wrap; }
.title-page .top span { font-size: 15px; color: var(--lilac); }
.sky { position: absolute; inset: 0; pointer-events: none; }
.stars-a { animation: twinkle 4s ease-in-out infinite; } .stars-b { animation: twinkle 5.5s ease-in-out 1.2s infinite; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.moon { position: absolute; right: max(40px, calc(50% - 500px)); top: 120px; width: 140px; height: 140px; border-radius: 50%; background: rgba(246,242,231,.08); }
.moon::before { content: ""; position: absolute; inset: 28px; border-radius: 50%; background: var(--paper); }
.moon::after { content: ""; position: absolute; left: 70px; top: 48px; width: 16px; height: 16px; border-radius: 50%; background: #E4DFF5; box-shadow: -14px 30px 0 -3px #E4DFF5; }
.cloud { position: absolute; border-radius: 999px; animation: drift 14s ease-in-out infinite; }
@keyframes drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
.hero { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding-top: 92px; }
.hero h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 8vw, 80px); line-height: 1; }
.hero h1 em { font-style: normal; color: var(--signal); }
.hero p { margin: 0; max-width: 700px; font-size: clamp(18px, 2.2vw, 21px); line-height: 1.5; color: #E4DFF5; }
.hero .btn { margin-top: 14px; min-height: 66px; padding: 0 38px 0 32px; font-size: 28px; border-radius: 18px; box-shadow: 0 7px 0 var(--signal-shadow); }
.city { position: relative; z-index: 1; width: 100%; max-width: 772px; margin: 52px auto 0; }
.city svg { display: block; width: 100%; height: auto; }
.title-foot { position: relative; z-index: 2; text-align: center; font-size: 14px; color: var(--paper); opacity: .85; margin-top: 18px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- phones and narrow windows ---------- */
@media (max-width: 860px) {
  .hud { padding: 12px 16px; }
  .hud .brand span, .progress .label-long { display: none; }
  .progress .track { width: 90px; }
  .stage, .stage.wide-char, .lab-stage { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 16px; }
  .char-col { display: none; }
  .head-row { display: flex; align-items: center; gap: 12px; }
  .head-row-bubble { display: block; }
  .head-row .head { width: 56px; height: 56px; }
  .head-row b { font-family: var(--font-display); font-weight: 800; font-size: 20px; display: block; }
  .head-row span { font-size: 13px; color: var(--lilac); }
  .content { padding-block: 18px 24px; }
  .bubble { font-size: 18px; padding: 12px 16px; }
  .btn { font-size: 20px; min-height: 56px; padding: 0 20px; width: 100%; }
  .replies { flex-direction: column; gap: 12px; }
  .choices, .compare, .debate, .reader-cards, .result-grid { grid-template-columns: minmax(0, 1fr); }
  .debate { gap: 16px; }
  .debater .head { width: 64px; height: 64px; }
  .choice .t { font-size: 21px; } .choice .d { font-size: 16px; }
  .scene-title { font-size: 28px; }
  .post { grid-template-columns: 28px minmax(0, 1fr); padding: 12px 14px; }
  .post .rank { font-size: 24px; }
  .post .move { grid-column: 2; justify-self: start; }
  .feed-head { padding: 10px 14px; }
  .caption { font-size: 17px; }
  .check-wrap, .result-wrap { padding: 20px 16px 28px; }
  .check-q { font-size: 28px; }
  .answer { font-size: 18px; padding: 12px 18px; }
  .answer .verdict { display: none; }
  .part { grid-template-columns: 110px minmax(0, 1fr) 40px; }
  .watched .big { font-size: 56px; }
  .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid3 { grid-template-columns: 48px repeat(3, minmax(0, 1fr)); gap: 6px; }
  .tile { font-size: 12px; height: 40px; }
  .hero { padding-top: 56px; }
  .moon { top: 84px; width: 96px; height: 96px; right: 16px; }
  .moon::before { inset: 18px; } .moon::after { left: 46px; top: 32px; width: 11px; height: 11px; }
}
/* ---------- clarity additions ---------- */
.algo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 40px; background: #1C1B48; border-bottom: 2px solid var(--line); font-size: 14px; }
.algo .lbl { font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--lilac); margin-right: 4px; }
.slot { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 999px; border: 2px dashed #4A4790; color: #9C97D6; }
.slot .n { width: 22px; height: 22px; border-radius: 50%; background: #2E2C66; color: var(--paper); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.slot.done { border-style: solid; border-color: var(--teal); color: var(--paper); }
.slot.done .n { background: var(--teal); color: var(--ink); }
.slot.now { border-style: solid; border-color: var(--signal); color: var(--signal); }
.slot.now .n { background: var(--signal); color: var(--ink); }
.slot b { color: inherit; }

.question { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 36px; line-height: 1.12; max-width: 760px; }
.lead { margin: 0; font-size: 19px; line-height: 1.5; color: #E4DFF5; max-width: 680px; }
.choice .ex { font-size: 15px; line-height: 1.4; padding: 8px 10px; border-radius: 10px; background: rgba(23,22,58,.12); }

.steps-how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.step-card { display: flex; flex-direction: column; gap: 8px; padding: 18px; background: var(--panel); border-radius: 18px; }
.step-card .num { width: 34px; height: 34px; border-radius: 50%; background: var(--signal); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.step-card b { font-family: var(--font-display); font-weight: 800; font-size: 21px; }
.step-card p { margin: 0; font-size: 16px; line-height: 1.45; color: #E4DFF5; }
.realbox { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border: 2px solid var(--teal); border-radius: 16px; font-size: 16px; line-height: 1.5; max-width: 900px; }
.realbox b.h { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); }
.realbox ul { margin: 0; padding-left: 20px; }

.feed-head .sub { width: 100%; font-size: 13px; color: var(--muted-ink); }
.post.v2 { grid-template-columns: 36px minmax(0, 1fr); align-items: start; }
.post.v2 .rank { line-height: 1.1; }
.badge { padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.badge.rel { background: var(--teal-dark); color: #fff; }
.badge.low { background: var(--ink); color: var(--paper); }
.badge.unk { border: 1.5px solid #5B587A; color: #3F3C5C; }
.badge.topic { background: var(--topic); color: var(--ink); }
.badge.match { background: #FFE9A8; color: var(--ink); }
.why { display: block; margin-top: 6px; font-size: 14px; color: #3F3C5C; }
.why b { color: var(--ink); }
.post .outlet { font-weight: 700; color: var(--ink); }

.takeaway { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; background: var(--panel); border-left: 0; border-radius: 16px; max-width: 640px; }
.takeaway .h { font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--lilac); }
.takeaway ul { margin: 0; padding-left: 20px; font-size: 17px; line-height: 1.5; }
.takeaway p { margin: 0; font-size: 18px; line-height: 1.45; }
.whatif { max-width: 640px; font-size: 16px; }
.whatif summary { cursor: pointer; font-weight: 700; color: var(--signal); padding: 6px 0; }
.whatif ol { margin: 8px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; line-height: 1.4; }
.whatif li span { color: var(--lilac); font-size: 14px; }

.legend-row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 15px; }
.legend-row span { display: inline-flex; align-items: center; gap: 8px; }
.story-card { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; background: var(--paper); color: var(--ink); border-radius: 16px; max-width: 640px; box-shadow: 6px 6px 0 #0D0C26; }
.story-card .title { font-size: 19px; font-weight: 700; line-height: 1.3; }
.story-card .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: #4F4C6E; }

.weeks { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.datanote { font-size: 13px; color: var(--lilac); line-height: 1.5; }

@media (max-width: 860px) {
  .algo { padding: 8px 16px; font-size: 13px; }
  .algo .lbl { width: 100%; }
  .steps-how { grid-template-columns: minmax(0, 1fr); }
  .question { font-size: 26px; }
  .lead { font-size: 17px; }
}

.legend-row .badge.low { outline: 1.5px solid var(--paper); outline-offset: 0; }

/* Rule lab: show what changed */
.lab-status { padding: 10px 14px; border-radius: 12px; background: #2B2966; font-size: 16px; line-height: 1.45; }
.lab-status b { color: var(--signal); }
.post.fresh { animation: fresh 1.4s ease-out both; }
@keyframes fresh { from { background: #FFE9A8; } to { background: transparent; } }
.post.missed { opacity: .55; padding-block: 8px; }
.post.missed .title { font-size: 15px; }
.post.missed .rank { font-size: 22px; }
.missed-label { padding: 8px 22px 2px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #5B587A; border-top: 2px dashed var(--rule); }
</style>

<script>
// Feed engine for You Own the Feed. Pure functions; works in the browser (window.FeedEngine) and Node.
(function (root) {
  var READERS = {
    mia: { name: "Mia", likes: ["health", "schools"], likeLabel: "health, schools" },
    leo: { name: "Leo", likes: ["business", "lockdown rules"], likeLabel: "business, lockdown rules" },
    sam: { name: "Sam", likes: ["politics", "local"], likeLabel: "politics, Chicago news" }
  };

  function addDays(iso, n) {
    var d = new Date(iso + "T12:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  // Stories published in the 7 days up to and including `day`.
  function pool(stories, day, days) {
    var from = addDays(day, -((days || 7) - 1));
    return stories.filter(function (s) { return s.d >= from && s.d <= day; });
  }

  function matches(story, reader) {
    var likes = READERS[reader].likes;
    return likes.indexOf(story.topic) >= 0 || (likes.indexOf("local") >= 0 && story.local === 1);
  }

  // Newest first: what the feed would show with no ranking rule at all.
  function newestFirst(list) {
    return list.slice().sort(function (a, b) { return a.d < b.d ? 1 : a.d > b.d ? -1 : b.id - a.id; });
  }

  /* Rank one day's pool for one reader.
     w.wR reactions, w.wI interests, w.wE reliability, w.wV variety, w.wH "more of what you clicked".
     history = topics this reader opened on earlier days (most recent last). */
  function rank(list, reader, w, history) {
    history = history || [];
    var scored = list.map(function (s) {
      var m = matches(s, reader) ? 1 : 0;
      var rel = s.rel === 1 ? 1 : s.rel === 0 ? -1 : 0;
      var h = history.filter(function (t) { return t === s.topic; }).length;
      var parts = {
        reactions: w.wR * Math.min(1, s.r / 20),
        interests: w.wI * m,
        reliability: w.wE * rel * 0.6,
        habit: w.wH * Math.min(h, 3) * 0.45
      };
      return { s: s, match: m, parts: parts, base: parts.reactions + parts.interests + parts.reliability + parts.habit };
    });
    var picked = [];
    var lastTopics = history.slice(-3);
    for (var k = 0; k < 3; k++) {
      var best = null, bestV = -Infinity;
      scored.forEach(function (c) {
        if (picked.indexOf(c) >= 0) return;
        var same = picked.filter(function (p) { return p.s.topic === c.s.topic; }).length;
        var stale = lastTopics.indexOf(c.s.topic) >= 0 ? 1 : 0;
        var v = c.base - w.wV * (0.45 * same + 0.25 * stale);
        if (v > bestV || (v === bestV && c.s.r > best.s.r)) { bestV = v; best = c; }
      });
      if (!best) break;
      best.final = bestV;
      picked.push(best);
    }
    // the one rule that did the most to put each story there
    picked.forEach(function (c) {
      var p = c.parts, top = "reactions", val = p.reactions;
      ["interests", "reliability", "habit"].forEach(function (k) { if (p[k] > val) { val = p[k]; top = k; } });
      c.why = top;
    });
    var base = newestFirst(list);
    picked.forEach(function (c) { c.was = base.indexOf(c.s) + 1; });
    return picked;
  }


  /* Rule lab ranking: every dial is on the same 0..1 scale so each one visibly matters.
     reactions = percentile of predicted reactions within this week's pool; interests = 1 if the reader follows the topic;
     reliability = +1 reliable outlet, -1 low-reliability outlet; a small recency term means "all dials off" = newest first. */
  function rankLab(list, reader, w, n) {
    var byR = list.slice().sort(function (a, b) { return a.r - b.r; });
    var newest = newestFirst(list);
    var N = Math.max(1, list.length - 1);
    var scored = list.map(function (s) {
      var pct = byR.indexOf(s) / N, rec = 1 - newest.indexOf(s) / N;
      var m = matches(s, reader) ? 1 : 0, rel = s.rel === 1 ? 1 : s.rel === 0 ? -1 : 0;
      var parts = { reactions: w.wR * pct, interests: w.wI * m, reliability: w.wE * rel * 0.8, recency: 0.6 * rec };
      return { s: s, match: m, parts: parts, base: parts.reactions + parts.interests + parts.reliability + parts.recency };
    });
    var picked = [];
    for (var k = 0; k < (n || 5); k++) {
      var best = null, bestV = -Infinity;
      scored.forEach(function (c) {
        if (picked.indexOf(c) >= 0) return;
        var same = picked.filter(function (p) { return p.s.topic === c.s.topic; }).length;
        var v = c.base - w.wV * 0.6 * same;
        if (v > bestV) { bestV = v; best = c; }
      });
      if (!best) break;
      picked.push(best);
    }
    picked.forEach(function (c) {
      var p = c.parts, top = "recency", val = p.recency;
      ["reactions", "interests", "reliability"].forEach(function (k) { if (p[k] > val) { val = p[k]; top = k; } });
      c.why = top;
    });
    return picked;
  }

  function metrics(feeds) {
    // feeds: array of picked lists (each 3 stories). Returns 0..1 shares.
    var slots = 0, rel = 0, match = 0, reactions = 0, topicsPerFeed = 0;
    feeds.forEach(function (f) {
      var topics = [];
      f.forEach(function (c) {

      }).join("") + "</div>";
    if (answered) html += '<div class="feedback">' + head(who, mood, 72) + '<div class="bubble"><b>' + PEOPLE[who].name + ":</b> " + (answered === "right" ? fb.right : fb.wrong) + "</div></div>" + nextBtn(next, nextLabel, "");
    else html += '<div class="hint">Pick one \u2014 you\'ll see the answer right away. Press 1 or 2.</div>';
    return html + "</main>";
  }
  SCREENS.S12 = function () {
    return checkScreen(1, 12, "Why did Mia's top 3 end up on one topic?", ["She asked to see only that topic.", "The feed kept rewarding what she had opened before."], 2, "check1", "jamie", "curious",
      { right: "Right. The feed learned from her clicks and kept serving more of the same.", wrong: "Not quite \u2014 she never asked. The feed kept rewarding what she had opened before." }, "S13", "Next question");
  };
  SCREENS.S13 = function () {
    return checkScreen(2, 13, "A story comes from an outlet the dataset rates as low reliability. What does that tell you?", ["The story is false.", "The outlet has a poor track record, so check the claim before trusting or sharing it."], 2, "check2", "alex", "look",
      { right: "Exactly. A low-reliability label is a warning about the outlet, not proof about one story. Check it elsewhere first.", wrong: "Careful \u2014 the label is about the outlet's track record, not proof that this story is false. Check it elsewhere first." }, "S14", "See your score");
  };

  function score() {
    var feeds = [feed1(), feed2(), feed3()];
    var met = E.metrics(feeds);
    var right = (state.check1 === "right" ? 1 : 0) + (state.check2 === "right" ? 1 : 0);
    var slots = 9;
    var rel = Math.round(met.relevance * 25), relia = Math.round(met.reliability * 25), vari = Math.round(met.variety * 25), und = Math.round(right * 12.5);
    var matchN = Math.round(met.relevance * slots), relN = Math.round(met.reliability * slots);
    var b = sumR(baseline(DAY1)) + sumR(baseline(DAY2)) + sumR(baseline(DAY3));
    var clicks = Math.round((met.reactions - b) / b * 100);
    return {
      total: rel + relia + vari + und, clicks: clicks,
      parts: [
        { name: "Relevance", n: rel, why: matchN + " of the 9 stories you showed matched what the reader follows." },
        { name: "Reliability", n: relia, why: relN + " of the 9 stories came from outlets rated reliable." },
        { name: "Variety", n: vari, why: state.rule3 === "variety" ? "You added variety, so feeds covered more topics." : "Feeds often repeated one topic. Mia's last top 3 was " + facts("mia", feeds[2], DAY3).topics.join(", ") + "." },
        { name: "Understanding", n: und, why: right === 2 ? "Both quick checks right." : right === 1 ? "One quick check right." : "No quick checks right \u2014 the Rule lab can help." }
      ]
    };
  }

  SCREENS.S14 = function () {
    var s = score();
    var morganLine = s.clicks >= 30 ? "Clicks up " + s.clicks + "%! I'm framing this." : s.clicks >= 0 ? "Up " + s.clicks + "%. I'll take it. Barely." : "Clicks down " + Math.abs(s.clicks) + "%. We need to talk.";
    return hud(14, s.clicks) + '<main class="result-wrap" tabindex="-1" style="padding-inline:64px">' +
      '<div><span class="eyebrow">Your score</span><h1 class="result-title">Here\'s the feed you built.</h1><p class="hint" style="font-size:19px;margin:6px 0 0">Morgan watched clicks. Your score shows the other half of the job: was the feed useful?</p></div>' +
      '<div class="result-grid"><section class="watched" aria-label="Clicks"><span class="eyebrow" style="font-size:14px">What Morgan watched</span><span class="big">' + signed(s.clicks) + '</span><b style="font-size:18px">Clicks vs. newest-first</b><span class="hint">Total predicted reactions on your 9 stories, compared with simply showing the newest stories. Simulated. Not part of your score.</span><div class="spacer"></div><div style="display:flex;align-items:center;gap:12px">' + head("morgan", "pumped", 64) + '<span style="font-size:17px;line-height:1.4">Morgan: \u201C' + morganLine + '\u201D</span></div></section>' +
      '<section class="scorecard" aria-label="Feed score"><div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span class="eyebrow" style="font-size:14px;color:var(--muted-ink)">Feed score</span><span class="total">' + s.total + "<small> / 100</small></span></div>" +
      s.parts.map(function (p) { return '<div class="part"><b>' + p.name + '</b><div class="bar"><i style="width:' + (p.n / 25 * 100) + '%"></i></div><span class="n">' + p.n + "</span><span></span><p>" + p.why + "</p></div>"; }).join("") +
      '<details class="how"><summary>How this is scored</summary><ul><li>Each part is out of 25, from the 9 stories you showed (Leo on Mar 30, Leo on May 6, Mia on May 9).</li><li>Relevance: share of stories that match the reader. Reliability: share from reliable outlets. Variety: how many different topics each top 3 covered. Understanding: the two quick checks.</li><li>Clicks never count toward the score.</li></ul></details></section></div>' +
      '<div class="next-row"><button class="btn" data-enter data-go="LAB">Try your own rules in the lab ' + ARROW + '</button><button class="btn-ghost" data-act="restart">Play again</button></div></main>';
  };

  /* ---------- Rule lab ---------- */
  var LAB_DIALS = [
    { key: "wR", label: "Reactions", hint: "Boost stories likely to get likes and shares" },
    { key: "wI", label: "Interests", hint: "Boost topics the reader follows" },
    { key: "wE", label: "Reliability", hint: "Lift reliable outlets, sink low-reliability ones" },
    { key: "wV", label: "Variety", hint: "Avoid repeating one topic in the top 3" }
  ];
  var WORDS = ["Off", "Low", "Mid", "High", "Max"];
  var LAB_DAYS = [["2020-03-30", "Week of Mar 30"], ["2020-04-20", "Week of Apr 20"], ["2020-05-06", "Week of May 6"]];
  function labStart() {
    var w = weights(state.rule1, state.rule2, state.rule3);
    return { wR: Math.min(4, w.wR), wI: Math.min(4, w.wI), wE: w.wE, wV: w.wV, wH: 0 };
  }
  function labRank(L, w) { return E.rankLab(E.pool(STORIES, L.day), L.reader, w || L.w, 5); }
  function labFeed(L, all, poolSize) {
    var name = E.READERS[L.reader].name, prev = L.prev;
    var rows = all.map(function (c, i) {
      var chip = "";
      if (prev && i < 3) {
        var was = prev.indexOf(c.s.id);
        if (was < 0) chip = '<span class="move new">New in top 3</span>';
        else if (was > i) chip = '<span class="move up">\u25B2 up ' + (was - i) + "</span>";
        else if (was < i) chip = '<span class="move down">\u25BC down ' + (i - was) + "</span>";
      }
      var fresh = prev && i < 3 && prev.indexOf(c.s.id) < 0;
      return '<div class="post v2' + (i >= 3 ? " missed" : "") + (fresh ? " fresh" : "") + '"><span class="rank">' + (i + 1) + '</span><div><span class="title">' + esc(c.s.t) + '</span><span class="meta">' + storyMeta(c.s, L.reader, true) + '</span><span class="why">Why it\'s here: <b>' + WHY[c.why](c, L.reader) + "</b></span>" + (chip ? '<span style="display:block;margin-top:6px">' + chip + "</span>" : "") + "</div></div>" +
        (i === 2 ? '<div class="missed-label">Just missed the top 3</div>' : "");
    }).join("");
    return '<section class="feed" style="max-width:none" aria-label="' + name + '\'s feed"><div class="feed-head"><div class="who">' + avatar(L.reader, 36) + "<b>" + name + "'s top 3</b><time>" + fmtDate(L.day, { weekday: "short", year: "numeric" }) + "</time></div>" +
      '<span class="sub">Picked from ' + poolSize + " real headlines published " + fmtDate(E.addDays(L.day, -6), { month: "short" }) + "\u2013" + fmtDate(L.day, { month: "short" }) + ", 2020 \u00B7 " + name + " follows " + E.READERS[L.reader].likeLabel + "</span></div>" + rows + "</section>";
  }
  SCREENS.LAB = function () {
    if (!state.lab) state.lab = { reader: "leo", day: "2020-05-06", w: labStart(), prev: null, change: null };
    var L = state.lab, poolSize = E.pool(STORIES, L.day).length;
    var all = labRank(L), list = all.slice(0, 3);
    var f = facts(L.reader, list, L.day), name = E.READERS[L.reader].name;
    var status;
    if (L.prev && L.change) {
      var ids = list.map(function (c) { return c.s.id; });
      var fresh = ids.filter(function (id) { return L.prev.indexOf(id) < 0; }).length;
      var reordered = !fresh && ids.join() !== L.prev.join();
      status = "<b>" + L.change + ":</b> " + (fresh ? fresh + " new " + (fresh === 1 ? "story" : "stories") + " in " + name + "\u2019s top 3." : reordered ? "same three stories, in a new order." : "no change in the top 3. This dial doesn\u2019t matter much for these stories this week \u2014 try a bigger jump, another dial or another week.");
    } else if (L.change) {
      status = "<b>" + L.change + "</b> \u2014 a new set of stories to rank.";
    } else {
      status = "Push a dial and watch the feed. Stories that change are marked.";
    }
    var insight;
    if (f.low > 0) insight = NUM[f.low].charAt(0).toUpperCase() + NUM[f.low].slice(1) + " of " + name + "\u2019s top 3 " + (f.low === 1 ? "comes" : "come") + " from a low-reliability outlet. Try turning up Reliability.";
    else if (f.topics.length === 1) insight = "All three stories are about " + f.topics[0] + ". What is " + name + " missing? Try Variety.";
    else if (f.m === 0) insight = "None of these match what " + name + " follows. Try Interests.";
    else if (f.clicks < 0) insight = "Relevant and reliable \u2014 but clicks are below newest-first. That\u2019s the trade-off.";
    else insight = "Let\u2019s check: push one dial to Max and watch what moves.";
    var dials = LAB_DIALS.map(function (d) {
      return '<div class="dial" role="group" aria-label="' + d.label + '"><div class="top"><b>' + d.label + '</b><span class="word">' + WORDS[L.w[d.key]] + '</span></div><span class="hint">' + d.hint + '</span><div class="steps">' +
        WORDS.map(function (word, i) { return '<button class="step" aria-pressed="' + (L.w[d.key] === i) + '" aria-label="' + d.label + ": " + word + '" data-act="dial:' + d.key + ":" + i + '">' + word + "</button>"; }).join("") + "</div></div>";
    }).join("");
    var tabs = '<span class="hint" style="font-size:15px">Whose feed?</span>' + ["mia", "leo", "sam"].map(function (id) {
      return '<button class="tab" aria-pressed="' + (L.reader === id) + '" data-act="reader:' + id + '"><i style="background:' + { mia: "#3DD6C4", leo: "#FF6B4A", sam: "#B9B2FF" }[id] + '"></i>' + E.READERS[id].name + "</button>";
    }).join("") + '<span class="hint" style="font-size:15px;margin-left:8px">Week:</span>' + LAB_DAYS.map(function (d) {
      return '<button class="tab" aria-pressed="' + (L.day === d[0]) + '" data-act="day:' + d[0] + '" style="padding:0 14px">' + d[1] + "</button>";
    }).join("");
    var met = E.metrics([list]);
    var meters = [
      ["Clicks vs. newest-first", signed(f.clicks), Math.max(0, Math.min(100, 50 + f.clicks / 2)), "var(--coral)"],
      ["Relevance", f.m + " / 3", f.m / 3 * 100, "var(--teal)"],
      ["Reliable outlets", Math.round(met.reliability * 3) + " / 3", met.reliability * 100, "var(--teal)"],
      ["Topics covered", f.topics.length + " / 3", f.topics.length / 3 * 100, "var(--teal)"]
    ].map(function (m) { return '<div class="meter"><span>' + m[0] + "</span><b>" + m[1] + '</b><div class="bar"><i style="width:' + m[2] + "%;background:" + m[3] + '"></i></div></div>'; }).join("");
    return '<header class="hud"><div class="brand">' + LOGO + "<b>TownSquare</b><span>Rule lab</span></div><span class=\"hint\" style=\"font-size:15px\">Bonus round \u00B7 a sandbox, doesn't change your score</span><button class=\"btn-ghost\" style=\"min-height:44px;font-size:16px\" data-act=\"restart\">Play again</button></header>" +
      '<main class="lab-stage" tabindex="-1"><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:4px">' + head("jamie", "curious", 56) +
      '<div class="bubble" style="font-size:18px;padding:10px 16px;border-radius:6px 16px 16px 16px;animation:none">' + insight + "</div></div>" + dials +
      '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:2px"><button class="btn-ghost" style="min-height:44px;font-size:15px;border-color:var(--lilac)" data-act="labreset">Back to your rules</button><button class="btn-ghost" style="min-height:44px;font-size:15px;border-color:var(--lilac)" data-act="laboff">All dials off</button></div>' +
      '<span class="hint" style="font-size:13px">\u201CBack to your rules\u201D uses your three decisions. With all dials off, the feed simply shows the newest stories.</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:14px;min-width:0"><div class="tabs">' + tabs + '</div><div class="lab-status" role="status" aria-live="polite">' + status + "</div>" + labFeed(L, all, poolSize) +
      '<div class="meters">' + meters + '</div><span class="datanote">Headlines and reliability labels: ReCOVery dataset. Predicted reactions and clicks are simulated from headline wording. In the lab, every dial uses the same 0\u20134 scale.</span></div></main>';
  };

  /* ================= runtime ================= */
  var app = document.getElementById("app");
  function render(focus) {
    var fn = SCREENS[state.screen] || SCREENS.title;
    app.innerHTML = state.screen === "title" ? fn() : '<div class="screen">' + fn() + "</div>";
    if (focus !== false) {
      window.scrollTo(0, 0);
      var main = app.querySelector("main");
      if (main) main.focus({ preventScroll: true });
    }
  }
  function go(id) { state.screen = id; render(); }
  function refocus(sel) { var el = app.querySelector(sel); if (el) el.focus(); }

  function act(a) {
    var p = a.split(":");
    if (p[0] === "rule1") { state.rule1 = p[1]; go("S05"); }
    else if (p[0] === "rule2") { state.rule2 = p[1]; go("S08"); }
    else if (p[0] === "rule3") { state.rule3 = p[1]; go("S11"); }
    else if (p[0] === "check1" || p[0] === "check2") {
      var pick = Number(p[1]);
      state[p[0] + "Pick"] = pick;
      state[p[0]] = pick === 2 ? "right" : "wrong";
      render(false); refocus("[data-enter]");
    }
    else if (p[0] === "restart") { state = Object.assign({}, FRESH); cache = {}; go("title"); }
    else if (p[0] === "dial" || p[0] === "labreset" || p[0] === "laboff") {
      var L = state.lab;
      L.prev = labRank(L).slice(0, 3).map(function (c) { return c.s.id; });
      if (p[0] === "dial") {
        L.w = Object.assign({}, L.w); L.w[p[1]] = Number(p[2]);
        L.change = LAB_DIALS.filter(function (d) { return d.key === p[1]; })[0].label + " \u2192 " + WORDS[Number(p[2])];
      } else if (p[0] === "labreset") { L.w = labStart(); L.change = "Back to your rules"; }
      else { L.w = { wR: 0, wI: 0, wE: 0, wV: 0, wH: 0 }; L.change = "All dials off"; }
      render(false); refocus('[data-act="' + a + '"]');
    }
    else if (p[0] === "reader") { state.lab.reader = p[1]; state.lab.prev = null; state.lab.change = "Now showing " + E.READERS[p[1]].name + "\u2019s feed"; render(false); refocus('[data-act="' + a + '"]'); }
    else if (p[0] === "day") { state.lab.day = p[1]; state.lab.prev = null; state.lab.change = "Switched to the " + LAB_DAYS.filter(function (d) { return d[0] === p[1]; })[0][1].toLowerCase(); render(false); refocus('[data-act="' + a + '"]'); }
  }

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go],[data-act]");
    if (!el || el.disabled) return;
    if (el.hasAttribute("data-act")) act(el.getAttribute("data-act"));
    else go(el.getAttribute("data-go"));
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var el = null, ae = document.activeElement;
    if (e.key === "1" || e.key === "2") el = app.querySelector('[data-key="' + e.key + '"]:not([disabled])');
    else if (e.key === "Enter" && (!ae || ae === document.body || ae.tagName === "MAIN")) el = app.querySelector("[data-enter]");
    if (el) { e.preventDefault(); el.click(); }
  });

  function start(saved) {
    if (saved && saved.screen && SCREENS[saved.screen]) state = Object.assign({}, FRESH, saved);
    render();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return state; });
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data);
})();

</script>
